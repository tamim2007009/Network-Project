[General]
network = MailNet

# Web-based Mail Transfer Protocol Simulation
# Simulates email exchange between two clients via SMTP and POP3 servers

sim-time-limit = 15s

# Network description:
# - client1 (addr=1): Sends email at t=1s, checks mail at t=8s
# - client2 (addr=2): Sends email at t=3s, checks mail at t=10s  
# - smtp (addr=3): Receives and forwards emails with 10ms processing
# - pop3 (addr=4): Stores and delivers emails with 5ms retrieval time

# Router configuration:
# - routes = "1:0,2:1,3:2,4:3" maps destination addresses to gate indices
